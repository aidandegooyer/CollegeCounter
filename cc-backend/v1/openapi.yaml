openapi: 3.1.0
info:
  title: College Counter API
  version: 1.0.0
  description: 'Read-only data behind collegecounter.org: teams, players, matches,
    rankings and events. No authentication. Requests are limited per IP; a 429 response''s
    Retry-After header says when to try again.'
paths:
  /v1/public/competitions:
    get:
      operationId: list_competitions
      description: Deduplicated by name, ignoring case, and sorted by name. Filter
        matches by competition with `competition_name`.
      summary: List competition names
      parameters:
      - in: query
        name: season_id
        schema:
          type: string
          format: uuid
        description: Competitions with matches in this season
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionNames'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: See `error`
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: Too many requests from this IP; see Retry-After
  /v1/public/events:
    get:
      operationId: list_events
      description: |-
        Public API endpoint to fetch events with various filters.

        Query Parameters:
        - id: Filter by event ID (comma-separated for multiple)
        - name: Filter by event name (partial match)
        - season_id: Filter by season ID
        - featured: Filter by featured status (true/false)
        - public_only: Only show public events (default: true)
        - page: Page number (default: 1)
        - page_size: Items per page (default: 20, max: 100)
        - sort: Sort field (default: start_date)
        - order: Sort order (asc or desc, default: desc)

        Returns a paginated list of events.
      summary: List events
      parameters:
      - in: query
        name: featured
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Featured status
      - in: query
        name: id
        schema:
          type: string
        description: Event ID, or several comma-separated
      - in: query
        name: name
        schema:
          type: string
        description: Name contains
      - in: query
        name: order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: Default desc
      - in: query
        name: page
        schema:
          type: integer
        description: Default 1
      - in: query
        name: page_size
        schema:
          type: integer
        description: Default 20, at most 100
      - in: query
        name: public_only
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: 'Default true: hide non-public events'
      - in: query
        name: season_id
        schema:
          type: string
          format: uuid
        description: Events in this season
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - end_date
          - name
          - start_date
        description: Default start_date
      - in: query
        name: trophycase
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Trophy case status
      - in: query
        name: winner_id
        schema:
          type: string
          format: uuid
        description: Events this team won
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: See `error`
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: Too many requests from this IP; see Retry-After
  /v1/public/events/{event_id}:
    get:
      operationId: get_event
      description: Public API endpoint to fetch a single event by ID.
      summary: Get an event
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEvent'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: See `error`
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: Too many requests from this IP; see Retry-After
  /v1/public/matches:
    get:
      operationId: list_matches
      description: |-
        Public API endpoint to fetch matches with various filters.

        Query Parameters:
        - id: Filter by match ID (comma-separated for multiple)
        - team_id: Filter by team ID (matches where team is team1 or team2)
        - team_id_1: Filter by first team ID (requires team_id_2, matches between these two teams)
        - team_id_2: Filter by second team ID (requires team_id_1, matches between these two teams)
        - status: Filter by status (scheduled, in_progress, completed, cancelled)
        - platform: Filter by platform (faceit, playfly)
        - date_from: Filter by date (matches after this date, format: YYYY-MM-DD)
        - date_to: Filter by date (matches before this date, format: YYYY-MM-DD)
        - season_id: Filter by season ID
        - competition_id: Filter by competition ID
        - event_id: Filter by event ID (matches that are part of a specific event)
        - page: Page number (default: 1)
        - page_size: Items per page (default: 20, max: 100)
        - sort: Sort field (default: -date for most recent first)
        - order: Sort order (asc or desc, default: asc)

        Returns a paginated list of matches.
      summary: List matches
      parameters:
      - in: query
        name: competition_id
        schema:
          type: string
          format: uuid
        description: Matches in this competition
      - in: query
        name: competition_name
        schema:
          type: string
        description: Exact competition name, ignoring case (see /competitions)
      - in: query
        name: date_from
        schema:
          type: string
        description: 'On or after: YYYY-MM-DD or ISO datetime'
      - in: query
        name: date_to
        schema:
          type: string
        description: On or before (a bare date includes that day)
      - in: query
        name: event_id
        schema:
          type: string
          format: uuid
        description: Matches in this event
      - in: query
        name: id
        schema:
          type: string
        description: Match ID, or several comma-separated
      - in: query
        name: order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: Default desc
      - in: query
        name: page
        schema:
          type: integer
        description: Default 1
      - in: query
        name: page_size
        schema:
          type: integer
        description: Default 20, at most 100
      - in: query
        name: platform
        schema:
          type: string
          enum:
          - faceit
          - playfly
        description: Platform
      - in: query
        name: season_id
        schema:
          type: string
          format: uuid
        description: Matches in this season
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - date
          - status
        description: Default date
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - in_progress
          - scheduled
        description: Match status
      - in: query
        name: team_id
        schema:
          type: string
          format: uuid
        description: Matches this team played in
      - in: query
        name: team_id_1
        schema:
          type: string
          format: uuid
        description: 'With team_id_2: matches between the two teams'
      - in: query
        name: team_id_2
        schema:
          type: string
          format: uuid
        description: 'With team_id_1: matches between the two teams'
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMatchList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: See `error`
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: Too many requests from this IP; see Retry-After
  /v1/public/players:
    get:
      operationId: list_players
      description: |-
        Public API endpoint to fetch players with various filters.

        Query Parameters:
        - id: Filter by player ID (comma-separated for multiple)
        - name: Filter by player name (partial match)
        - team_id: Filter by team ID
        - steam_id: Filter by Steam ID
        - faceit_id: Filter by Faceit ID
        - visible: Filter by visibility (true/false)
        - benched: Filter by bench status (true/false)
        - page: Page number (default: 1)
        - page_size: Items per page (default: 20, max: 100)
        - sort: Sort field (default: name)
        - order: Sort order (asc or desc, default: asc)
        - season_id: Filter players that participated in a specific season

        Returns a paginated list of players.
      summary: List players
      parameters:
      - in: query
        name: benched
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Bench status
      - in: query
        name: faceit_id
        schema:
          type: string
        description: Exact Faceit ID
      - in: query
        name: id
        schema:
          type: string
        description: Player ID, or several comma-separated
      - in: query
        name: name
        schema:
          type: string
        description: Name contains
      - in: query
        name: order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: Default asc
      - in: query
        name: page
        schema:
          type: integer
        description: Default 1
      - in: query
        name: page_size
        schema:
          type: integer
        description: Default 20, at most 100
      - in: query
        name: season_id
        schema:
          type: string
          format: uuid
        description: Players in this season
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - elo
          - name
          - skill_level
        description: Default name
      - in: query
        name: steam_id
        schema:
          type: string
        description: Exact Steam ID
      - in: query
        name: team_id
        schema:
          type: string
          format: uuid
        description: Players on this team
      - in: query
        name: visible
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: 'Default: visible players only'
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlayerList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: See `error`
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: Too many requests from this IP; see Retry-After
  /v1/public/ranking-items:
    get:
      operationId: list_ranking_items
      description: |-
        Public API endpoint to fetch ranking items for a specific ranking.

        Query Parameters:
        - ranking_id: Filter by ranking ID (required)
        - page: Page number (default: 1)
        - page_size: Items per page (default: 20, max: 100)
        - sort: Sort field (default: rank)
        - order: Sort order (asc or desc, default: asc)

        Returns a paginated list of ranking items.
      summary: List the teams in a ranking
      parameters:
      - in: query
        name: order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: Default asc
      - in: query
        name: page
        schema:
          type: integer
        description: Default 1
      - in: query
        name: page_size
        schema:
          type: integer
        description: Default 20, at most 100
      - in: query
        name: ranking_id
        schema:
          type: string
          format: uuid
        description: The ranking
        required: true
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - elo
          - rank
        description: Default rank
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRankingItemList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: See `error`
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: Too many requests from this IP; see Retry-After
  /v1/public/rankings:
    get:
      operationId: list_rankings
      description: |-
        Public API endpoint to fetch rankings with various filters.

        Query Parameters:
        - season_id: Filter by season ID (required for filtering)
        - page: Page number (default: 1)
        - page_size: Items per page (default: 20, max: 100)
        - sort: Sort field (default: -date for most recent first)
        - order: Sort order (asc or desc, default: desc)

        Returns a paginated list of rankings.
      summary: List ranking snapshots
      parameters:
      - in: query
        name: order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: Default desc
      - in: query
        name: page
        schema:
          type: integer
        description: Default 1
      - in: query
        name: page_size
        schema:
          type: integer
        description: Default 20, at most 100
      - in: query
        name: season_id
        schema:
          type: string
          format: uuid
        description: Rankings in this season
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - date
        description: Default date
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRankingList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: See `error`
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: Too many requests from this IP; see Retry-After
  /v1/public/search:
    get:
      operationId: search
      description: |-
        Public API endpoint to search across teams, players, and events.

        Query Parameters:
        - q: Search query (required)
        - limit: Max results per section (default: 6, max: 20)
      summary: Search teams, players and events
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Results per section, 1-20 (default 6)
      - in: query
        name: q
        schema:
          type: string
        description: Search text; an empty query returns no results
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: Too many requests from this IP; see Retry-After
  /v1/public/seasons:
    get:
      operationId: list_seasons
      description: |-
        Public API endpoint to fetch seasons.

        Query Parameters:
        - id: Filter by season ID (comma-separated for multiple)
        - current: Filter for current season (true/false)
        - page: Page number (default: 1)
        - page_size: Items per page (default: 20, max: 100)
        - sort: Sort field (default: -start_date for most recent first)
        - order: Sort order (asc or desc, default: desc)

        Returns a paginated list of seasons.
      summary: List seasons
      parameters:
      - in: query
        name: current
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: 'true: only the current season'
      - in: query
        name: id
        schema:
          type: string
        description: Season ID, or several comma-separated
      - in: query
        name: order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: Default desc
      - in: query
        name: page
        schema:
          type: integer
        description: Default 1
      - in: query
        name: page_size
        schema:
          type: integer
        description: Default 20, at most 100
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - end_date
          - name
          - start_date
        description: Default start_date
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSeasonList'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: Too many requests from this IP; see Retry-After
  /v1/public/team-current-ranking:
    get:
      operationId: get_team_current_ranking
      description: The team's place in the season's latest ranking.
      summary: Get a team's current ranking
      parameters:
      - in: query
        name: season_id
        schema:
          type: string
          format: uuid
        description: 'Default: the current season'
      - in: query
        name: team_id
        schema:
          type: string
          format: uuid
        description: The team
        required: true
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRankingItem'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: See `error`
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: See `error`
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: Too many requests from this IP; see Retry-After
  /v1/public/team_ranking_history:
    get:
      operationId: get_team_ranking_history
      description: |-
        Public API endpoint to fetch a team's ranking history.

        Query Parameters:
        - team_id: Team ID (required)
        - season_id: Season ID (optional)

        Returns a list of ranking items for the team.
      summary: Get a team's ranking history
      parameters:
      - in: query
        name: season_id
        schema:
          type: string
          format: uuid
        description: Only rankings in this season
      - in: query
        name: team_id
        schema:
          type: string
          format: uuid
        description: The team
        required: true
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRankingHistory'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: See `error`
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: Too many requests from this IP; see Retry-After
  /v1/public/team_recent_form:
    get:
      operationId: get_team_recent_form
      description: |-
        Public API endpoint to fetch a team's recent match form.

        Query Parameters:
        - team_id: Team ID (required)
        - limit: Number of recent matches to fetch (default: 5, max: 20)

        Returns a list of recent matches with results.
      summary: Get a team's recent results
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Completed matches, at most 5 (default 3)
      - in: query
        name: team_id
        schema:
          type: string
          format: uuid
        description: The team
        required: true
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRecentForm'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: See `error`
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: Too many requests from this IP; see Retry-After
  /v1/public/teams:
    get:
      operationId: list_teams
      description: |-
        Public API endpoint to fetch teams with various filters.

        Query Parameters:
        - id: Filter by team ID (comma-separated for multiple)
        - name: Filter by team name (partial match)
        - school_name: Filter by school name (partial match)
        - season_id: Filter by season ID
        - competition_id: Filter by competition ID
        - event_id: Filter teams that have matches in a specific event
        - page: Page number (default: 1)
        - page_size: Items per page (default: 20, max: 100)
        - sort: Sort field (default: name)
        - order: Sort order (asc or desc, default: asc)
        - season_id: Filter teams that participated in a specific season

        Returns a paginated list of teams with their current ranking information.
        Each team includes current_ranking with rank and elo from the latest ranking snapshot.
      summary: List teams
      parameters:
      - in: query
        name: competition_id
        schema:
          type: string
          format: uuid
        description: Teams in this competition
      - in: query
        name: event_id
        schema:
          type: string
          format: uuid
        description: Teams with a match in this event
      - in: query
        name: id
        schema:
          type: string
        description: Team ID, or several comma-separated
      - in: query
        name: name
        schema:
          type: string
        description: Name contains
      - in: query
        name: order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: Default asc
      - in: query
        name: page
        schema:
          type: integer
        description: Default 1
      - in: query
        name: page_size
        schema:
          type: integer
        description: Default 20, at most 100
      - in: query
        name: school_name
        schema:
          type: string
        description: School name contains
      - in: query
        name: season_id
        schema:
          type: string
          format: uuid
        description: Teams in this season
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - elo
          - name
          - school_name
        description: Default name
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeamList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: See `error`
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: Too many requests from this IP; see Retry-After
  /v1/public/version:
    get:
      operationId: get_version
      description: The public API version and the build that's running.
      summary: Get the API version and running build
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: Too many requests from this IP; see Retry-After
components:
  schemas:
    CompetitionName:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    CompetitionNames:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CompetitionName'
      required:
      - results
    CompetitionRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    CustomEventDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bracket_link:
          type:
          - string
          - 'null'
          format: uri
        stream_link:
          type:
          - string
          - 'null'
          format: uri
        secondary_stream_link:
          type:
          - string
          - 'null'
          format: uri
        discord_link:
          type:
          - string
          - 'null'
          format: uri
        registration_link:
          type:
          - string
          - 'null'
          format: uri
        rules_document:
          type:
          - string
          - 'null'
          format: uri
        prize_pool:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        prize_currency:
          type: string
        max_teams:
          type:
