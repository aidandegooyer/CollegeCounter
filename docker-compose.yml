
services:
  # Reverse proxy (nginx)
  proxy:
    image: jwilder/nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - /etc/nginx/vhost.d:/etc/nginx/vhost.d:rw
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - /usr/share/nginx/html:/usr/share/nginx/html:rw
    environment:
      - PROXY_CONNECT_TIMEOUT=600
      - PROXY_SEND_TIMEOUT=600
      - PROXY_READ_TIMEOUT=600

  # Let's Encrypt companion
  acme-companion:
    image: nginxproxy/acme-companion
    restart: always
    environment:
       NGINX_PROXY_CONTAINER: collegecounter-proxy-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/nginx/vhost.d:/etc/nginx/vhost.d:rw
      - /usr/share/nginx/html:/usr/share/nginx/html:rw
      - ./certs:/etc/nginx/certs
      - /var/run/docker.sock:/tmp/docker.sock:ro
    depends_on:
      - proxy

  frontend:
    build:
      context: ./cc-frontend/v1
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        VITE_CURRENT_SEASON_ID: ${VITE_CURRENT_SEASON_ID}
    environment:
      VIRTUAL_HOST: collegecounter.org,www.collegecounter.org
      LETSENCRYPT_HOST: collegecounter.org,www.collegecounter.org
      LETSENCRYPT_EMAIL: collegiatecounter@gmail.com
    depends_on:
      - backend
    expose:
      - "80"

  backend:
    build: ./cc-backend/v1
    environment:
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      PLAYFLY_API_KEY: ${PLAYFLY_API_KEY}
      FACEIT_API_KEY: ${FACEIT_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      NWES_API_KEY: ${NWES_API_KEY}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      DISCORD_ALERTS_WEBHOOK_URL: ${DISCORD_ALERTS_WEBHOOK_URL}
      SERVICE_NAME: backend
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
      # Picture storage (cc/images.py); see README "Image storage"
      IMAGE_STORAGE_BUCKET: ${IMAGE_STORAGE_BUCKET:-}
      IMAGE_CDN_BASE_URL: ${IMAGE_CDN_BASE_URL:-}
      IMAGE_STORAGE_REGION: ${IMAGE_STORAGE_REGION:-us-east-1}
      IMAGE_STORAGE_ENDPOINT_URL: ${IMAGE_STORAGE_ENDPOINT_URL:-}
      IMAGE_STORAGE_ACL: ${IMAGE_STORAGE_ACL:-}
      IMAGE_AWS_ACCESS_KEY_ID: ${IMAGE_AWS_ACCESS_KEY_ID:-}
      IMAGE_AWS_SECRET_ACCESS_KEY: ${IMAGE_AWS_SECRET_ACCESS_KEY:-}
      VIRTUAL_HOST: api.collegecounter.org
      LETSENCRYPT_HOST: api.collegecounter.org
      LETSENCRYPT_EMAIL: collegiatecounter@gmail.com
    volumes:
      - ./credentials/college-counter-9057f-firebase-adminsdk-fbsvc-a632f7f6e6.json:/secrets/college-counter-9057f-firebase-adminsdk-fbsvc-a632f7f6e6.json:ro
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  # Refreshes matches from Faceit / LeagueSpot / Regents League in the
  # background (cc/views/match_sync.py), and hourly copies pictures hosted
  # elsewhere into the image bucket. Same image as the backend; skips its
  # entrypoint so only the backend runs migrations. No VIRTUAL_HOST, so the
  # proxy doesn't route to it.
  match-sync:
    build: ./cc-backend/v1
    restart: always
    entrypoint: ["python", "manage.py", "sync_matches", "--loop"]
    environment:
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      PLAYFLY_API_KEY: ${PLAYFLY_API_KEY}
      FACEIT_API_KEY: ${FACEIT_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      IMAGE_STORAGE_BUCKET: ${IMAGE_STORAGE_BUCKET:-}
      IMAGE_CDN_BASE_URL: ${IMAGE_CDN_BASE_URL:-}
      IMAGE_STORAGE_REGION: ${IMAGE_STORAGE_REGION:-us-east-1}
      IMAGE_STORAGE_ENDPOINT_URL: ${IMAGE_STORAGE_ENDPOINT_URL:-}
      IMAGE_STORAGE_ACL: ${IMAGE_STORAGE_ACL:-}
      IMAGE_AWS_ACCESS_KEY_ID: ${IMAGE_AWS_ACCESS_KEY_ID:-}
      IMAGE_AWS_SECRET_ACCESS_KEY: ${IMAGE_AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Daily pg_dump to ./backups (newest 14 kept), each also copied to
  # BACKUP_S3_URI when it's set (see scripts/backup-db.sh). One-off backup:
  #   docker compose run --rm db-backup once
  # Shows "unhealthy" in `docker compose ps` if no dump, or no off-site copy,
  # in the last 26h. Failures also post to DISCORD_ALERTS_WEBHOOK_URL.
  db-backup:
    build:
      context: ./scripts
      dockerfile: db-backup.Dockerfile
    restart: always
    entrypoint: ["/backup-db.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      KEEP_BACKUPS: 14
      BACKUP_HOUR_UTC: 9
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_AWS_REGION:-us-east-1}
      DISCORD_ALERTS_WEBHOOK_URL: ${DISCORD_ALERTS_WEBHOOK_URL:-}
    volumes:
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name 'cc_*.sql.gz' -mmin -1560 | grep -q . && { [ -z \"$$BACKUP_S3_URI\" ] || find /backups -name .offsite_ok -mmin -1560 | grep -q .; }"]
      interval: 1h
      start_period: 5m
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  certs:

